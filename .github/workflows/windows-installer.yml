name: Windows installer preview
on:
  push:
    tags: ['build/windows-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-installer-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked CPU dependencies
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-windows.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'locked dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'dependency consistency failed' }
      - name: Unit tests, frozen build, installation and offline smoke
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload tested installer to draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'v0.2.0-preview.1'
          python -m scripts.release_manifest --verify-tag --repo $env:GITHUB_REPOSITORY --tag $Tag --expected-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw '실제 원격 태그 commit 검증 실패; 업로드 중단' }
          $Raw = gh release view $Tag --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw '릴리스 조회 실패; 생성/업로드 중단' }
          $Release = $Raw | ConvertFrom-Json
          if ($Release.isDraft -ne $true) { throw '검증된 태그의 draft 릴리스만 업로드 가능' }
          $Assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release upload $Tag @Assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'draft upload failed' }
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics-${{ github.sha }}
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
