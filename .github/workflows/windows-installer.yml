name: Windows installer preview
on:
  push:
    branches: [codex/windows-installer]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-installer-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked CPU dependencies
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-windows.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'locked dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'dependency consistency failed' }
      - name: Unit tests, frozen build, installation and offline smoke
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload tested installer to draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'v0.2.0-preview.1'
          $Raw = gh release view $Tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $Release = $Raw | ConvertFrom-Json
            if (-not $Release.isDraft -or $Release.targetCommitish -ne $env:GITHUB_SHA) {
              throw 'Existing release must be a draft targeting this exact source commit; parent review required'
            }
          } else {
            $Notes = "모델·Chromium 포함 Windows CPU 미리보기. Setup.exe와 모든 .bin을 같은 폴더에 저장하고 실행하세요. 설치 self-test는 동작 검사이며 탐지 정확도 보장이 아닙니다. 최종 검토 전 draft를 유지합니다."
            gh release create $Tag --target $env:GITHUB_SHA --title 'AdPurifier 0.2.0 preview 1' --notes $Notes --draft --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'draft release creation failed' }
          }
          $Assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release upload $Tag @Assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'draft upload failed' }
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics-${{ github.sha }}
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
